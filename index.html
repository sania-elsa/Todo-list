<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>To-Do List</title> 
        <link rel="stylesheet" href="style.css"> 
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"> 
    </head> 
    <body> 
        <div class="todo-container"> 
            <div class="theme-toggle"> 
                <button id="theme-btn"> 
                    <i class="fa-solid fa-moon"></i> 
                </button> 
            </div> 
            <h1>To-Do List</h1> 
            <div class="workspace-header">
                <div class="category-tabs" id="workspace-tabs-container">
                </div>
                <button id="add-workspace-btn" class="add-workspace-btn" title="Add Workspace">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div class="input-section"> 
                <input type="text" id="task-input" placeholder="Enter a task" class="task-input"> 
                <select id="priority-select" class="priority-select"> 
                    <option value="Urgent">Urgent</option> 
                    <option value="Important">Important</option> 
                    <option value="Low priority">Low priority</option> 
                </select> 
                <button id="add-btn" class="add-btn">Add Task</button> 
            </div> 
            <ul id="task-list" class="task-list"></ul> 
        </div> 
        <script src="script.js"></script> 
    </body> 
</html>
